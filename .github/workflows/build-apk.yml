name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Verify Android SDK
  shell: bash
  run: |
    echo "ANDROID_HOME=$ANDROID_HOME"
    echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

    echo "Installed SDK packages:"
    sdkmanager --list_installed || true

    echo "Checking AIDL:"
    AIDL="$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

    if [ ! -f "$AIDL" ]; then
      echo "ERROR: AIDL was not found!"
      exit 1
    fi

    if [ ! -x "$AIDL" ]; then
      echo "ERROR: AIDL exists but is not executable!"
      exit 1
    fi

    echo "AIDL found successfully:"
    ls -lh "$AIDL"

    echo "AIDL executable test:"
    "$AIDL" --help >/dev/null

    echo "AIDL is installed and working."

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: visualize-debug-apk
          path: bin/*.apk
          if-no-files-found: error