name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # =========================================================
      # PYTHON
      # =========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =========================================================
      # JAVA
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # =========================================================
      # INSTALL ANDROID SDK PACKAGES
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo ""
          echo "Checking sdkmanager..."

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found:"
            echo "$SDKMANAGER"
            exit 1
          fi

          echo "sdkmanager found:"
          ls -lh "$SDKMANAGER"

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android SDK packages:"

          "$SDKMANAGER" --list_installed || true

          echo ""
          echo "Build Tools 35.0.0:"

          ls -lah \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo ""
          echo "Android SDK installation completed."


      # =========================================================
      # VERIFY GLOBAL AIDL
      # =========================================================
      - name: Verify Android AIDL
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING ANDROID AIDL"
          echo "========================================"

          AIDL="$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

          echo "AIDL:"
          echo "$AIDL"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL was not found."

            echo ""
            echo "Available build tools:"

            ls -lah \
              "$ANDROID_SDK_ROOT/build-tools" || true

            exit 1
          fi

          echo ""
          echo "AIDL found:"

          ls -lh "$AIDL"

          echo ""
          echo "Testing AIDL..."

          "$AIDL" --help >/dev/null

          echo ""
          echo "AIDL is working."


      # =========================================================
      # INSTALL BUILDOZER
      # =========================================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALLING BUILDOZER"
          echo "========================================"

          python -m pip install --upgrade pip

          python -m pip install \
            --upgrade \
            setuptools \
            wheel

          python -m pip install buildozer

          python -m pip install cython

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          cython --version


      # =========================================================
      # PREPARE BUILDOZER ANDROID SDK
      # =========================================================
      - name: Prepare Buildozer Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING BUILDOZER SDK"
          echo "========================================"

          BUILDOZER_DIR="$HOME/.buildozer/android"

          BUILDOZER_SDK="$BUILDOZER_DIR/platform/android-sdk"

          echo ""
          echo "Buildozer directory:"
          echo "$BUILDOZER_DIR"

          echo ""
          echo "Buildozer SDK:"
          echo "$BUILDOZER_SDK"

          # -----------------------------------------------------
          # Create:
          #
          # ~/.buildozer/android/platform/
          # -----------------------------------------------------

          echo ""
          echo "Creating Buildozer platform directory..."

          mkdir -p "$(dirname "$BUILDOZER_SDK")"

          # -----------------------------------------------------
          # Remove any previous SDK
          # -----------------------------------------------------

          echo ""
          echo "Removing previous Buildozer SDK..."

          rm -rf "$BUILDOZER_SDK"

          # -----------------------------------------------------
          # Copy modern GitHub Android SDK
          # -----------------------------------------------------

          echo ""
          echo "Copying Android SDK..."

          cp -a "$ANDROID_SDK_ROOT" "$BUILDOZER_SDK"

          echo ""
          echo "Modern Android SDK copied."


          # =====================================================
          # CREATE LEGACY BUILDOZER SDK STRUCTURE
          # =====================================================

          echo ""
          echo "========================================"
          echo "CREATING LEGACY SDK COMPATIBILITY PATH"
          echo "========================================"

          echo ""
          echo "Buildozer expects:"
          echo "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Modern Android SDK provides:"
          echo "$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager"


          # -----------------------------------------------------
          # Remove tools directory if it exists
          # -----------------------------------------------------

          rm -rf "$BUILDOZER_SDK/tools"

          # -----------------------------------------------------
          # Create compatibility link
          #
          # tools -> cmdline-tools/latest
          #
          # Therefore:
          #
          # tools/bin/sdkmanager
          #
          # becomes:
          #
          # cmdline-tools/latest/bin/sdkmanager
          # -----------------------------------------------------

          ln -s \
            "$BUILDOZER_SDK/cmdline-tools/latest" \
            "$BUILDOZER_SDK/tools"


          # =====================================================
          # VERIFY SDKMANAGER
          # =====================================================

          echo ""
          echo "========================================"
          echo "VERIFYING SDKMANAGER"
          echo "========================================"

          LEGACY_SDKMANAGER="$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Legacy sdkmanager path:"
          echo "$LEGACY_SDKMANAGER"

          if [ ! -f "$LEGACY_SDKMANAGER" ]; then

            echo ""
            echo "ERROR: Legacy sdkmanager path does not exist."

            echo ""
            echo "Checking cmdline-tools:"

            find \
              "$BUILDOZER_SDK/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name "sdkmanager" \
              -ls || true

            echo ""
            echo "Checking tools:"

            ls -lah \
              "$BUILDOZER_SDK/tools" || true

            exit 1
          fi

          echo ""
          echo "sdkmanager found:"

          ls -lh "$LEGACY_SDKMANAGER"

          echo ""
          echo "sdkmanager version:"

          "$LEGACY_SDKMANAGER" --version


          # =====================================================
          # VERIFY BUILD TOOLS
          # =====================================================

          echo ""
          echo "========================================"
          echo "VERIFYING BUILD TOOLS"
          echo "========================================"

          if [ ! -d "$BUILDOZER_SDK/build-tools/35.0.0" ]; then
            echo "ERROR: Build Tools 35.0.0 not found."
            exit 1
          fi

          echo ""
          echo "Build Tools 35.0.0:"

          ls -lah \
            "$BUILDOZER_SDK/build-tools/35.0.0"


          # =====================================================
          # VERIFY AIDL
          # =====================================================

          echo ""
          echo "========================================"
          echo "VERIFYING BUILDOZER AIDL"
          echo "========================================"

          BUILDOZER_AIDL="$BUILDOZER_SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "AIDL:"
          echo "$BUILDOZER_AIDL"

          if [ ! -f "$BUILDOZER_AIDL" ]; then
            echo "ERROR: AIDL was not copied."
            exit 1
          fi

          ls -lh "$BUILDOZER_AIDL"

          echo ""
          echo "Testing AIDL..."

          "$BUILDOZER_AIDL" --help >/dev/null

          echo ""
          echo "AIDL works."


          # =====================================================
          # FINAL SDK STRUCTURE
          # =====================================================

          echo ""
          echo "========================================"
          echo "BUILDOZER SDK READY"
          echo "========================================"

          echo ""
          echo "SDK:"
          echo "$BUILDOZER_SDK"

          echo ""
          echo "sdkmanager:"
          echo "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "AIDL:"
          echo "$BUILDOZER_SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "Buildozer SDK preparation completed."


      # =========================================================
      # CONFIGURE ANDROID ENVIRONMENT
      # =========================================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "CONFIGURING ANDROID ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Using SDK:"
          echo "$BUILDOZER_SDK"

          # -----------------------------------------------------
          # Environment variables
          # -----------------------------------------------------

          echo "ANDROID_HOME=$BUILDOZER_SDK" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$BUILDOZER_SDK" >> "$GITHUB_ENV"

          echo "ANDROIDSDK=$BUILDOZER_SDK" >> "$GITHUB_ENV"

          # -----------------------------------------------------
          # PATH
          # -----------------------------------------------------

          echo "$BUILDOZER_SDK/platform-tools" >> "$GITHUB_PATH"

          echo "$BUILDOZER_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "$BUILDOZER_SDK/tools/bin" >> "$GITHUB_PATH"


          # =====================================================
          # VERIFY SDKMANAGER
          # =====================================================

          echo ""
          echo "Testing Buildozer sdkmanager..."

          "$BUILDOZER_SDK/tools/bin/sdkmanager" --version


          echo ""
          echo "Android environment configured."


      # =========================================================
      # VERIFY BUILDOZER SDK
      # =========================================================
      - name: Verify Buildozer SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "VERIFYING BUILDOZER SDK"
          echo "========================================"

          echo ""
          echo "SDK:"
          echo "$SDK"


          # -----------------------------------------------------
          # SDK
          # -----------------------------------------------------

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Buildozer SDK does not exist."
            exit 1
          fi


          # -----------------------------------------------------
          # sdkmanager
          # -----------------------------------------------------

          echo ""
          echo "sdkmanager:"

          ls -lh \
            "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version


          # -----------------------------------------------------
          # Build tools
          # -----------------------------------------------------

          echo ""
          echo "Build tools:"

          ls -lah \
            "$SDK/build-tools"


          # -----------------------------------------------------
          # Build Tools 35
          # -----------------------------------------------------

          echo ""
          echo "Build Tools 35.0.0:"

          ls -lah \
            "$SDK/build-tools/35.0.0"


          # -----------------------------------------------------
          # AIDL
          # -----------------------------------------------------

          echo ""
          echo "AIDL:"

          ls -lh \
            "$SDK/build-tools/35.0.0/aidl"


          # -----------------------------------------------------
          # Test AIDL
          # -----------------------------------------------------

          echo ""
          echo "Testing AIDL..."

          "$SDK/build-tools/35.0.0/aidl" --help >/dev/null


          echo ""
          echo "========================================"
          echo "BUILDOZER SDK VERIFIED"
          echo "========================================"


      # =========================================================
      # SHOW BUILD ENVIRONMENT
      # =========================================================
      - name: Show build environment
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "ANDROIDSDK:"
          echo "$ANDROIDSDK"

          echo ""
          echo "sdkmanager:"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

          echo ""
          echo "AIDL:"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" --help >/dev/null

          echo ""
          echo "Build environment ready."


      # =========================================================
      # BUILD APK
      # =========================================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING ANDROID APK"
          echo "========================================"

          buildozer -v android debug


      # =========================================================
      # CHECK APK
      # =========================================================
      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING APK"
          echo "========================================"

          if [ ! -d "bin" ]; then
            echo "ERROR: bin directory not found."
            exit 1
          fi

          echo ""
          echo "bin directory:"

          ls -lah bin/


          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          echo ""
          echo "APK count:"
          echo "$APK_COUNT"


          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi


          echo ""
          echo "========================================"
          echo "APK GENERATED SUCCESSFULLY"
          echo "========================================"


      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: visualize-debug-apk
          path: bin/*.apk
          if-no-files-found: error