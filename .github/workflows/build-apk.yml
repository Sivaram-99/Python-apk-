name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # =========================================================
      # Python
      # =========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =========================================================
      # Java
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # Install Buildozer
      # =========================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython


      # =========================================================
      # Configure Android licenses
      # =========================================================
      - name: Prepare Android environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Preparing Android environment"
          echo "========================================"

          mkdir -p "$HOME/.buildozer/android/platform"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          # Make Android SDK tools available
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version


      # =========================================================
      # Build APK
      # =========================================================
      - name: Build APK
        shell: bash
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "1"
          ANDROID_ACCEPT_SDK_LICENSE: "1"
          P4A_ACCEPT_ANDROID_SDK_LICENSE: "1"
        run: |
          set -e

          echo "========================================"
          echo "BUILDING ANDROID APK"
          echo "========================================"

          buildozer -v android debug


      # =========================================================
      # Check APK
      # =========================================================
      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking APK"
          echo "========================================"

          if [ ! -d "bin" ]; then
            echo "ERROR: bin directory was not created."
            exit 1
          fi

          ls -lah bin/

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully."
          echo "APK count: $APK_COUNT"


      # =========================================================
      # Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: visualize-debug-apk
          path: bin/*.apk
          if-no-files-found: error