name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ---------------------------------------------------------
      # Java
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0


      # ---------------------------------------------------------
      # Verify Android SDK + AIDL
      # ---------------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "========================================"
          echo "Android SDK Information"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed SDK packages:"
          sdkmanager --list_installed || true

          echo ""
          echo "========================================"
          echo "Checking AIDL"
          echo "========================================"

          AIDL="$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL was not found!"
            echo "Expected location:"
            echo "$AIDL"
            exit 1
          fi

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL exists but is not executable!"
            ls -lh "$AIDL"
            exit 1
          fi

          echo "AIDL found successfully:"
          ls -lh "$AIDL"

          echo ""
          echo "Testing AIDL executable..."

          "$AIDL" --help > /dev/null

          echo "AIDL is installed and working."

          echo ""
          echo "========================================"
          echo "Android SDK verification completed"
          echo "========================================"


      # ---------------------------------------------------------
      # Install Buildozer
      # ---------------------------------------------------------
      - name: Install Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install --upgrade buildozer

          pip install --upgrade cython


      # ---------------------------------------------------------
      # Show versions
      # ---------------------------------------------------------
      - name: Show build environment
        shell: bash
        run: |
          echo "========================================"
          echo "Build Environment"
          echo "========================================"

          python --version
          pip --version
          java -version
          buildozer --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "AIDL:"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" --help > /dev/null

          echo ""
          echo "========================================"


      # ---------------------------------------------------------
      # Build APK
      # ---------------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          echo "========================================"
          echo "Starting Buildozer Android build"
          echo "========================================"

          buildozer -v android debug


      # ---------------------------------------------------------
      # Check generated APK
      # ---------------------------------------------------------
      - name: Check APK
        shell: bash
        run: |
          echo "========================================"
          echo "Checking generated APK"
          echo "========================================"

          if [ ! -d "bin" ]; then
            echo "ERROR: bin directory was not created."
            exit 1
          fi

          ls -lah bin/

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated."
          echo "Number of APK files: $APK_COUNT"


      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: visualize-debug-apk
          path: bin/*.apk
          if-no-files-found: error