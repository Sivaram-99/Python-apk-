name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # =========================================================
      # Python
      # =========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =========================================================
      # Java
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # Android SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # =========================================================
      # Install Android SDK
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK SETUP"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installing required SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed SDK packages:"
          "$SDKMANAGER" --list_installed || true

          echo ""
          echo "Android SDK setup completed."


      # =========================================================
      # Verify AIDL
      # =========================================================
      - name: Verify AIDL
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING AIDL"
          echo "========================================"

          AIDL="$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

          echo "AIDL:"
          echo "$AIDL"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL not found!"
            exit 1
          fi

          ls -lh "$AIDL"

          "$AIDL" --help >/dev/null

          echo ""
          echo "AIDL is working."


      # =========================================================
      # IMPORTANT:
      # Tell Buildozer/python-for-android to use GitHub SDK
      # =========================================================
      - name: Configure Buildozer Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURING BUILDOZER SDK"
          echo "========================================"

          echo "Using Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Setting Buildozer environment..."

          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Buildozer will use:"
          echo "$ANDROID_SDK_ROOT"


      # =========================================================
      # Install Buildozer
      # =========================================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          pip install buildozer
          pip install cython

          echo ""
          buildozer --version


      # =========================================================
      # Verify Build Environment
      # =========================================================
      - name: Verify Build Environment
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "ANDROIDSDK:"
          echo "$ANDROIDSDK"

          echo ""
          echo "AIDL:"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" --help >/dev/null

          echo ""
          echo "Build environment OK."


      # =========================================================
      # Build APK
      # =========================================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          buildozer -v android debug


      # =========================================================
      # Check APK
      # =========================================================
      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECKING APK"
          echo "========================================"

          if [ ! -d "bin" ]; then
            echo "ERROR: bin directory not found."
            exit 1
          fi

          ls -lah bin/

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully."


      # =========================================================
      # Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: visualize-debug-apk
          path: bin/*.apk
          if-no-files-found: error