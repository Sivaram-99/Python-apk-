name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Android SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "latest sdkmanager not found."
            echo "Searching for sdkmanager..."

            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -name sdkmanager \
              -type f \
              | sort -V \
              | tail -1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager could not be found."
            exit 1
          fi

          echo ""
          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses || true

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK packages installed successfully."

      - name: Verify AIDL
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking AIDL"
          echo "========================================"

          AIDL="$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl"

          echo "Expected AIDL:"
          echo "$AIDL"

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL was not found!"
            echo ""
            echo "Build tools directory:"
            ls -lah "$ANDROID_SDK_ROOT/build-tools/35.0.0/" || true
            exit 1
          fi

          echo ""
          echo "AIDL found:"
          ls -lh "$AIDL"

          echo ""
          echo "Testing AIDL..."

          "$AIDL" --help >/dev/null

          echo ""
          echo "AIDL is working correctly."

      - name: Show Android environment
        shell: bash
        run: |
          echo "========================================"
          echo "Android Environment"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed platforms:"
          ls -lah "$ANDROID_SDK_ROOT/platforms" || true

          echo ""
          echo "Installed build tools:"
          ls -lah "$ANDROID_SDK_ROOT/build-tools" || true

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

      - name: Install Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          pip install buildozer
          pip install cython

      - name: Verify Buildozer
        shell: bash
        run: |
          echo "========================================"
          echo "Buildozer"
          echo "========================================"

          buildozer --version

          echo ""
          echo "Cython:"
          cython --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING ANDROID APK"
          echo "========================================"

          buildozer -v android debug

      - name: Check APK
        shell: bash
        run: |
          echo "========================================"
          echo "Checking APK"
          echo "========================================"

          if [ ! -d "bin" ]; then
            echo "ERROR: bin directory does not exist."
            exit 1
          fi

          ls -lah bin/

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully."
          echo "APK count: $APK_COUNT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: visualize-debug-apk
          path: bin/*.apk
          if-no-files-found: error